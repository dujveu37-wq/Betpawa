name: collect
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      start_round:
        description: "Premier lancement: numero de round non encore commence"
        required: false
concurrency:
  group: collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Collecte
        run: bash run.sh ${{ github.event.inputs.start_round }}
